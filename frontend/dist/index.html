      if (isServer && !window.__API_BASE_URL__) {
        // Auto-detect backend URL based on frontend URL
        // If frontend is on http://65.1.126.85, backend is likely on same server

        window.__API_BASE_URL__ = `${window.location.protocol}//${window.location.hostname}:${backendPort}`;

        // Default to localhost for local development
        window.__API_BASE_URL__ = 'http://localhost:3000';
